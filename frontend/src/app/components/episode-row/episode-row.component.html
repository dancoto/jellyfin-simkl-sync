<td class="ep-num">E{{ epNum() }}</td>
<td class="ep-name" [title]="epName()">{{ epName() }}</td>
<td>
  @if (official(); as off) {
    <a
      [href]="'https://anilist.co/anime/' + off.anilistId"
      target="_blank"
      class="badge-official"
      title="Official AniBridge / AnimeList mapping"
    >
      🌸 {{ off.anilistId }} <span class="official-sub">Ep {{ off.anilistEpisode }}</span> ↗
    </a>
  } @else {
    <span class="badge-none">None / Unmapped</span>
  }
</td>
<td>
  <div class="id-input-group">
    <input
      type="text"
      inputmode="numeric"
      class="id-input"
      [class.null-val]="isIdNullVal()"
      [value]="anilistIdValue()"
      [placeholder]="idInputPlaceholder()"
      title="Override AniList Media ID (leave blank to use official mapping, or type null to unmap)"
      (change)="onIdChange($event)"
    />
    <input
      type="number"
      class="id-input ep-sub-input"
      [value]="anilistEpisodeValue()"
      title="AniList Episode Number"
      (change)="onEpisodeChange($event)"
    />
    <span class="override-pill" [class]="statusPill().class" [title]="statusPill().title">
      {{ statusPill().text }}
    </span>
  </div>
</td>
<td>
  <div class="row-actions">
    @if (official()) {
      <button
        class="btn btn-secondary btn-xs"
        title="Copy official AniList ID to override fields"
        (click)="useOfficial.emit()"
      >
        📋 Official
      </button>
    }
    <button
      class="btn btn-sm"
      [class]="isAniListSkipped() ? 'btn-anilist-skipped' : 'btn-secondary'"
      [title]="isAniListSkipped() ? 'AniList skipped. Click to unskip.' : 'Skip AniList for this episode (will use TVDB for Simkl)'"
      (click)="toggleSkip.emit()"
    >
      🌸 {{ isAniListSkipped() ? 'Skipped' : 'Skip' }}
    </button>
    <button
      class="btn btn-secondary btn-sm"
      title="Clear override (defaults to official mapping, or null if unmapped)"
      (click)="clearOverride.emit()"
    >
      ∅ Clear
    </button>
  </div>
</td>
