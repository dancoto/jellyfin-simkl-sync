@if (totalItems() > 0) {
  <div class="pagination-container">
    <div class="pagination-info">
      Showing <strong>{{ startItem() }} - {{ endItem() }}</strong> of <strong>{{ totalItems() }}</strong> shows
    </div>

    <div class="pagination-controls">
      <button
        mat-icon-button
        class="p-icon-btn"
        [disabled]="currentPage() === 1"
        title="First page"
        (click)="goToPage(1)"
      >
        <mat-icon class="p-icon">first_page</mat-icon>
      </button>
      <button
        mat-icon-button
        class="p-icon-btn"
        [disabled]="currentPage() === 1"
        title="Previous page"
        (click)="goToPage(currentPage() - 1)"
      >
        <mat-icon class="p-icon">chevron_left</mat-icon>
      </button>

      @for (p of visiblePages(); track p) {
        <button
          mat-button
          class="p-num-btn"
          [class.active]="p === currentPage()"
          (click)="goToPage(p)"
        >
          {{ p }}
        </button>
      }

      <button
        mat-icon-button
        class="p-icon-btn"
        [disabled]="currentPage() === totalPages()"
        title="Next page"
        (click)="goToPage(currentPage() + 1)"
      >
        <mat-icon class="p-icon">chevron_right</mat-icon>
      </button>
      <button
        mat-icon-button
        class="p-icon-btn"
        [disabled]="currentPage() === totalPages()"
        title="Last page"
        (click)="goToPage(totalPages())"
      >
        <mat-icon class="p-icon">last_page</mat-icon>
      </button>
    </div>

    <div class="page-size-selector">
      <span>Per page:</span>
      <select [value]="pageSize()" class="size-select" (change)="handlePageSizeChange($event)">
        <option [value]="25">25</option>
        <option [value]="50">50</option>
        <option [value]="100">100</option>
        <option [value]="99999">All</option>
      </select>
    </div>
  </div>
}
